<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>立体ルーム試作</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--bg:#FDF3F7;--fg:#4A2E45;--muted:#8A6A86;--accent:#C2457C;--line:#F1D6E2}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Zen Maru Gothic',sans-serif;padding:16px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;margin:0}p{margin:0;font-size:13px;color:var(--muted);line-height:1.7}
svg{width:100%;height:auto;display:block;border-radius:24px;background:linear-gradient(#FFF7FA,#FBE3EC);touch-action:none;user-select:none}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:#fff;color:var(--fg);font-weight:700}
button.on{background:var(--accent);color:#fff;border-color:transparent}
.sel{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 6px #E879A8)}
</style></head><body><div class="wrap">
<h1>立体ルームの試作</h1>
<p>アイテムを指でドラッグすると、床のマスにぴったり置けます。かべの飾りは、かべの上を動かせます。選んだアイテムは「向きを変える」で反転できます。</p>
<svg id="room" viewBox="0 0 360 360"></svg>
<div class="bar"><button id="flip" type="button">向きを変える</button><button id="grid" type="button">マス目を表示</button></div>
<p>※ 試作なので、ここで動かした配置は保存されません。</p>
</div>
<script>
var N=6,TW=52,TH=26,OX=180,OY=176,WH=138;
function P(gx,gy,z){return [OX+(gx-gy)*TW/2, OY+(gx+gy)*TH/2-(z||0)];}
function pts(a){return a.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');}
function shade2(c){return '#F3E6D8';}
function shade(hex,k){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;var f=function(v){return Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));};return 'rgb('+f(r)+','+f(g)+','+f(b)+')';}
/* 立体の箱：位置(gx,gy)、大きさ(w,d)、高さh、床からの高さz */
function box(gx,gy,w,d,h,c,z){z=z||0;
  var t=[P(gx,gy,z+h),P(gx+w,gy,z+h),P(gx+w,gy+d,z+h),P(gx,gy+d,z+h)];
  var L=[P(gx,gy+d,z+h),P(gx+w,gy+d,z+h),P(gx+w,gy+d,z),P(gx,gy+d,z)];
  var R=[P(gx+w,gy,z+h),P(gx+w,gy+d,z+h),P(gx+w,gy+d,z),P(gx+w,gy,z)];
  return '<polygon points="'+pts(L)+'" fill="'+shade(c,-.08)+'"/><polygon points="'+pts(R)+'" fill="'+shade(c,-.2)+'"/><polygon points="'+pts(t)+'" fill="'+shade(c,.12)+'" stroke="'+shade(c,.35)+'" stroke-width=".6"/>';}
function flat(gx,gy,w,d,c,z){return '<polygon points="'+pts([P(gx,gy,z||0),P(gx+w,gy,z||0),P(gx+w,gy+d,z||0),P(gx,gy+d,z||0)])+'" fill="'+c+'"/>';}
var STAR='M0-7l2 4.6 5 .5-3.8 3.3 1.1 4.9L0 2.8l-4.3 2.5 1.1-4.9L-7-2.9l5-.5z';
var ITEMS={
 rug:{name:'ラグ',w:3,d:3,flat:1,c:'#E9B8F0',draw:function(it){var c=it.c,s=flat(it.gx,it.gy,3,3,shade(c,.2));s+=flat(it.gx+.25,it.gy+.25,2.5,2.5,c);s+=flat(it.gx+.8,it.gy+.8,1.4,1.4,shade(c,.45));var m=P(it.gx+1.5,it.gy+1.5);return s+'<path d="'+STAR+'" transform="translate('+m[0]+' '+m[1]+') scale(1.3 .65)" fill="#FFE07A"/>';}},
 bed:{name:'ベッド',w:2,d:3,c:'#F4A9C4',draw:function(it){var x=it.gx,y=it.gy,f=it.flip,w=f?3:2,d=f?2:3,s=(f?box(x,y,.25,d,46,'#D9B48F'):box(x,y,w,.25,46,'#D9B48F'))+box(x,y,w,d,16,'#E7CDB5');s+=box(x,y,w,d,10,'#FFFFFF',16);
   s+=f?box(x+1,y,2,d,4,it.c,26)+box(x+.15,y+.3,.7,1.4,7,'#FFF5FA',26):box(x,y+1,w,2,4,it.c,26)+box(x+.3,y+.15,1.4,.7,7,'#FFF5FA',26);
   return s;}},
 shelf:{name:'グッズ棚',w:2,d:1,c:'#D9B48F',wallR:1,draw:function(it){var x=it.gx,y=it.gy,f=it.flip,w=f?1:2,d=f?2:1,c=it.c;var s=f?box(x,y,.12,d,92,shade2(c)):box(x,y,w,.12,92,shade2(c));
   s+=f?box(x,y,w,.12,92,c):box(x,y,.12,d,92,c);
   s+=box(x,y,w,d,8,c);[32,60].forEach(function(z){s+=box(x,y,w,d,4,c,z);});
   var gs=[['#F7A8C6',14,12],['#A8D8F0',16,12],['#C9B6F2',12,36],['#FFE07A',14,36]];gs.forEach(function(g,i){var k=i%2?1.05:.35;s+=box(f?x+.3:x+k,f?y+k:y+.3,.4,.4,g[1],g[0],g[2]);});
   s+=box(x,y,w,d,4,c,88);s+=f?box(x,y+d-.12,w,.12,92,c):box(x+w-.12,y,.12,d,92,c);
   var m=P(f?x+.5:x+1,f?y+1:y+.5,72);s+='<path d="'+STAR+'" transform="translate('+m[0]+' '+m[1]+')" fill="#F2789F"/>';return s;}},
 table:{name:'ローテーブル',w:1,d:1,c:'#FFFFFF',draw:function(it){var x=it.gx,y=it.gy,s=box(x+.15,y+.15,.7,.7,10,'#E7CDB5');s+=box(x,y,1,1,4,it.c,10);var m=P(x+.5,y+.5,14);return s+'<ellipse cx="'+m[0]+'" cy="'+(m[1]-3)+'" rx="6" ry="3" fill="#F7A8C6"/><rect x="'+(m[0]-4)+'" y="'+(m[1]-10)+'" width="8" height="7" rx="2" fill="#F7A8C6"/>';}},
 plant:{name:'観葉植物',w:1,d:1,c:'#8FD6A8',draw:function(it){var x=it.gx,y=it.gy,s=box(x+.25,y+.25,.5,.5,16,'#F2C3A6');var m=P(x+.5,y+.5,16);
   return s+['-9,-14,9','8,-16,9','0,-26,10','-4,-6,7','6,-6,7'].map(function(q){q=q.split(',');return '<circle cx="'+(m[0]+ +q[0])+'" cy="'+(m[1]+ +q[1])+'" r="'+q[2]+'" fill="'+shade(it.c,(+q[1])/80)+'"/>';}).join('');}},
 penlight:{name:'ペンライト立て',w:1,d:1,c:'#C9B6F2',draw:function(it){var x=it.gx,y=it.gy,s=box(x+.2,y+.2,.6,.6,8,'#FFFFFF');var m=P(x+.5,y+.5,8),col=[it.c,'#F7A8C6','#A8D8F0'];
   [-6,0,6].forEach(function(dx,i){s+='<rect x="'+(m[0]+dx-2.5)+'" y="'+(m[1]-34+Math.abs(dx))+'" width="5" height="'+(30-Math.abs(dx))+'" rx="2.5" fill="'+col[i]+'"/><circle cx="'+(m[0]+dx)+'" cy="'+(m[1]-34+Math.abs(dx))+'" r="7" fill="'+col[i]+'" opacity=".3"/>';});return s;}},
 nui:{name:'ぬいぐるみ',w:1,d:1,c:'#F7C6D9',draw:function(it){var m=P(it.gx+.5,it.gy+.5),c=it.c;return '<ellipse cx="'+m[0]+'" cy="'+(m[1]+1)+'" rx="12" ry="5" fill="rgba(120,60,100,.12)"/><ellipse cx="'+m[0]+'" cy="'+(m[1]-10)+'" rx="12" ry="11" fill="'+c+'"/><circle cx="'+m[0]+'" cy="'+(m[1]-26)+'" r="11" fill="'+c+'"/><circle cx="'+(m[0]-8)+'" cy="'+(m[1]-36)+'" r="4.5" fill="'+c+'"/><circle cx="'+(m[0]+8)+'" cy="'+(m[1]-36)+'" r="4.5" fill="'+c+'"/><circle cx="'+(m[0]-4)+'" cy="'+(m[1]-27)+'" r="1.6" fill="#4A2E45"/><circle cx="'+(m[0]+4)+'" cy="'+(m[1]-27)+'" r="1.6" fill="#4A2E45"/><ellipse cx="'+m[0]+'" cy="'+(m[1]-22)+'" rx="2.5" ry="1.6" fill="#E8789E"/>';}},
 piggy:{name:'貯金箱',w:1,d:1,c:'#F5B4CB',draw:function(it){var m=P(it.gx+.5,it.gy+.5),c=it.c;return '<ellipse cx="'+m[0]+'" cy="'+(m[1]+1)+'" rx="13" ry="5" fill="rgba(120,60,100,.12)"/><ellipse cx="'+m[0]+'" cy="'+(m[1]-11)+'" rx="15" ry="12" fill="'+c+'"/><ellipse cx="'+(m[0]+12)+'" cy="'+(m[1]-11)+'" rx="5" ry="4.5" fill="'+shade(c,-.1)+'"/><circle cx="'+(m[0]+4)+'" cy="'+(m[1]-15)+'" r="1.7" fill="#4A2E45"/><path d="M'+(m[0]-6)+' '+(m[1]-24)+' l4 -6 3 6z" fill="'+c+'"/><rect x="'+(m[0]-5)+'" y="'+(m[1]-23)+'" width="8" height="2" rx="1" fill="'+shade(c,-.3)+'"/>';}},
 char:{name:'わたし',w:1,d:1,draw:function(it){var m=P(it.gx+.5,it.gy+.5),W=74,H=W*732/600;return '<ellipse cx="'+m[0]+'" cy="'+m[1]+'" rx="18" ry="6" fill="rgba(120,60,100,.16)"/><g transform="translate('+(m[0]-W/2)+' '+(m[1]-H+4)+')'+(it.flip?' translate('+W+' 0) scale(-1 1)':'')+'"><image href="../assets/char/base.webp" width="'+W+'" height="'+H+'"/><image href="../assets/char/hair/bob.webp" width="'+W+'" height="'+H+'"/></g>';}},
 window:{name:'まど',wall:1,w:2.6,h:52,c:'#FFFFFF',draw:function(it){return '<rect x="0" y="0" width="64" height="56" rx="4" fill="'+it.c+'"/><rect x="5" y="5" width="54" height="46" rx="2" fill="#CDEBFA"/><circle cx="44" cy="17" r="6" fill="#FFF3B0"/><ellipse cx="20" cy="38" rx="12" ry="5" fill="#fff"/><path d="M32 5v46M5 28h54" stroke="'+it.c+'" stroke-width="3"/><path d="M-6 -4h76" stroke="#E7CDB5" stroke-width="4" stroke-linecap="round"/><path d="M-4 -2 q6 34 -2 62 h12 q4 -30 0 -62z M68 -2 q-6 34 2 62 h-12 q-4 -30 0 -62z" fill="#F7A8C6"/>';}},
 poster:{name:'推しポスター',wall:1,w:1.7,h:60,c:'#C9B6F2',draw:function(it){return '<rect x="0" y="0" width="44" height="58" rx="3" fill="#fff"/><rect x="4" y="4" width="36" height="50" fill="'+it.c+'"/><path d="'+STAR+'" transform="translate(22 22) scale(1.6)" fill="#FFE07A"/><rect x="9" y="40" width="26" height="4" rx="2" fill="#fff" opacity=".8"/><rect x="13" y="47" width="18" height="3" rx="1.5" fill="#fff" opacity=".6"/>';}},
 garland:{name:'ガーランド',wall:1,w:4.6,h:30,c:'#F7A8C6',draw:function(it){var s='<path d="M0 2 Q60 22 120 2" stroke="#D9B48F" stroke-width="1.5" fill="none"/>';for(var i=0;i<7;i++){var x0=4+i*16,y0=2+20*(x0/120)*(1-x0/120)*4,c=[it.c,'#FFFFFF','#C9B6F2'][i%3];s+='<path d="M'+x0+' '+y0+' l12 '+(i<3?2:-1)+' l-5 14z" fill="'+c+'"/>';}return s;}}
};
var S=[
 {id:'rug',gx:2,gy:2,c:'#E9B8F0'},{id:'bed',gx:0,gy:3,c:'#F4A9C4'},{id:'shelf',gx:3,gy:0,c:'#D9B48F'},{id:'table',gx:3,gy:3,c:'#FFFFFF'},
 {id:'plant',gx:0,gy:0,c:'#8FD6A8'},{id:'penlight',gx:5,gy:0,c:'#C9B6F2'},{id:'nui',gx:2,gy:3,c:'#F7C6D9'},{id:'piggy',gx:5,gy:4,c:'#F5B4CB'},
 {id:'char',gx:3,gy:2},
 {id:'window',side:'L',u:2.9,z:66,c:'#FFFFFF'},{id:'poster',side:'R',u:.6,z:80,c:'#C9B6F2'},{id:'garland',side:'R',u:1,z:120,c:'#F7A8C6'}
];
var sel=null,showGrid=false;
function dims(it){var d=ITEMS[it.id];return it.flip&&!d.flat?{w:d.d,d:d.w}:{w:d.w,d:d.d};}
function wallXf(it){/* L: かべ(gx=0) 左手前へ下がる / R: かべ(gy=0) 右手前へ下がる */
  if(it.side==='L'){var p=P(0,it.u,it.z);return 'matrix(1,0.5,0,1,'+(p[0]-64)+','+(p[1]-32-ITEMS[it.id].h)+')';}
  var q=P(it.u,0,it.z);return 'matrix(1,0.5,0,1,'+q[0]+','+(q[1]-ITEMS[it.id].h)+')';}
/* 奥にあるものから順に描く */
function behind(a,b){var da=dims(a),db=dims(b);return a.gx+da.w<=b.gx||a.gy+da.d<=b.gy;}
function depthSort(list){var flats=list.filter(function(i){return ITEMS[i.id].flat;}),rest=list.filter(function(i){return !ITEMS[i.id].flat;}),out=[];
  while(rest.length){var k=0;for(var i=0;i<rest.length;i++){var ok=true;for(var j=0;j<rest.length;j++)if(i!==j&&behind(rest[j],rest[i])&&!behind(rest[i],rest[j])){ok=false;break;}if(ok){k=i;break;}}out.push(rest.splice(k,1)[0]);}
  return flats.concat(out);}
function render(){
  var s='<defs><pattern id="wp" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.6" fill="#fff" opacity=".7"/><circle cx="12" cy="12" r="1.6" fill="#fff" opacity=".7"/></pattern></defs>';
  var c0=P(0,0),cR=P(N,0),cL=P(0,N),cF=P(N,N);
  s+='<polygon points="'+pts([[c0[0],c0[1]-WH],[cL[0],cL[1]-WH],cL,c0])+'" fill="#FBD3E0"/><polygon points="'+pts([[c0[0],c0[1]-WH],[cL[0],cL[1]-WH],cL,c0])+'" fill="url(#wp)"/>';
  s+='<polygon points="'+pts([[c0[0],c0[1]-WH],[cR[0],cR[1]-WH],cR,c0])+'" fill="#F6C2D4"/><polygon points="'+pts([[c0[0],c0[1]-WH],[cR[0],cR[1]-WH],cR,c0])+'" fill="url(#wp)"/>';
  s+='<polygon points="'+pts([P(0,0,8),P(0,N,8),cL,c0])+'" fill="#FFFFFF" opacity=".85"/><polygon points="'+pts([P(0,0,8),P(N,0,8),cR,c0])+'" fill="#F3E3EA"/>';
  s+='<polygon points="'+pts([c0,cR,cF,cL])+'" fill="#F3DCC4"/>';
  for(var i=1;i<N*2;i++){var a=P(i/2,0),b=P(i/2,N);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#E6C8AC" stroke-width=".8"/>';}
  if(showGrid)for(var g=0;g<=N;g++){var a1=P(g,0),b1=P(g,N),a2=P(0,g),b2=P(N,g);s+='<line x1="'+a1[0]+'" y1="'+a1[1]+'" x2="'+b1[0]+'" y2="'+b1[1]+'" stroke="#C2457C" stroke-opacity=".35"/><line x1="'+a2[0]+'" y1="'+a2[1]+'" x2="'+b2[0]+'" y2="'+b2[1]+'" stroke="#C2457C" stroke-opacity=".35"/>';}
  S.filter(function(it){return ITEMS[it.id].wall;}).forEach(function(it){s+='<g data-k="'+S.indexOf(it)+'" class="'+(sel===it?'sel':'')+'" transform="'+wallXf(it)+'"'+(it.side==='L'?'':'')+'>'+(it.side==='L'?'<g transform="matrix(1,-1,0,1,0,64)">'+ITEMS[it.id].draw(it)+'</g>':ITEMS[it.id].draw(it))+'</g>';});
  var fl=S.filter(function(it){return !ITEMS[it.id].wall;});
  fl=depthSort(fl);
  fl.forEach(function(it){if(sel===it){var d=dims(it);s+='<polygon points="'+pts([P(it.gx,it.gy),P(it.gx+d.w,it.gy),P(it.gx+d.w,it.gy+d.d),P(it.gx,it.gy+d.d)])+'" fill="#E879A8" opacity=".3"/>';}
    s+='<g data-k="'+S.indexOf(it)+'" class="'+(sel===it?'sel':'')+'">'+ITEMS[it.id].draw(it)+'</g>';});
  document.getElementById('room').innerHTML=s;
}
var svg=document.getElementById('room'),drag=null;
function sp(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function toGrid(x,y){var a=(x-OX)/(TW/2),b=(y-OY)/(TH/2);return [(a+b)/2,(b-a)/2];}
svg.addEventListener('pointerdown',function(e){var g=e.target.closest('[data-k]');if(!g){sel=null;render();return;}sel=S[+g.getAttribute('data-k')];var p=sp(e),q=toGrid(p.x,p.y);
  drag={it:sel,q0:q,p0:p,gx:sel.gx,gy:sel.gy,u:sel.u,z:sel.z};try{svg.setPointerCapture(e.pointerId);}catch(_){}render();e.preventDefault();});
svg.addEventListener('pointermove',function(e){if(!drag)return;var it=drag.it,p=sp(e),d;
  if(ITEMS[it.id].wall){var dx=p.x-drag.p0.x,dy=p.y-drag.p0.y,du=it.side==='L'?-dx/(TW/2):dx/(TW/2);var W=ITEMS[it.id].w;
    it.u=Math.max(0,Math.min(N-W,drag.u+du));it.z=Math.max(30,Math.min(WH-10,drag.z-(dy-Math.abs(dx)*.5*(it.side==='L'?-1:1)*0)));render();return;}
  var q=toGrid(p.x,p.y);d=dims(it);
  var nx=Math.round(drag.gx+q[0]-drag.q0[0]),ny=Math.round(drag.gy+q[1]-drag.q0[1]);
  nx=Math.max(0,Math.min(N-d.w,nx));ny=Math.max(0,Math.min(N-d.d,ny));if(nx!==it.gx||ny!==it.gy){it.gx=nx;it.gy=ny;render();}});
function end(){drag=null;}svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
document.getElementById('flip').onclick=function(){if(!sel||ITEMS[sel.id].wall)return;sel.flip=!sel.flip;var d=dims(sel);sel.gx=Math.min(sel.gx,N-d.w);sel.gy=Math.min(sel.gy,N-d.d);render();};
document.getElementById('grid').onclick=function(){showGrid=!showGrid;this.classList.toggle('on',showGrid);render();};
render();
</script></body></html>
